---
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: every gate in the project image
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build the image and run every gate in it
        env:
          RETAIL_INPUTS: absent
        run: ./run.sh --gates

      - name: The doctor reports on a runner with no dump and no microcode
        run: |
          ./run.sh doctor.py || true
          ./run.sh -c "import doctor; found = doctor.examine(); assert found; print(len(found))"

  release:
    name: release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: [gates]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install release tooling
        run: pnpm install --frozen-lockfile

      - name: Check the release tooling against known advisories, since npm signatures cannot be
        run: pnpm audit --audit-level=high

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
