---
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: every gate in the project image
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build the image and run every gate in it
        env:
          RETAIL_INPUTS: absent
        run: ./run.sh --gates

      - name: The doctor reports on a runner with no dump and no microcode
        run: >-
          ./run.sh -c "import doctor; said = [];
          code = doctor.main(say=said.append); print(*said, sep=chr(10));
          assert code == 1 and said[-1].startswith('  next:'), code"
