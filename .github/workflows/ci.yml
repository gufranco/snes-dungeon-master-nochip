name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pipx install ruff==0.16.3

      - name: Install the type checker
        run: pipx install mypy==1.14.1

      - name: Lint
        run: ruff check .

      # The models are separate repositories with their own checks, so this only
      # needs the submodules present for the imports to resolve.
      - name: Types
        run: mypy .

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install the formatter
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check that every JSON and YAML file is formatted
        run: pnpm run format:check

      - name: Check formatting
        run: ruff format --check .

      - name: Lint the workflows
        uses: raven-actions/actionlint@v2

      - name: Lint the shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=style --shell=bash scripts/*.sh

  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install coverage
        run: python -m pip install --disable-pip-version-check coverage==7.6.10

      - name: Run every test module, under coverage
        run: |
          python3 -m coverage erase
          failed=0
          for module in *.test.py tools/*.test.py; do
            echo "::group::${module}"
            python3 -m coverage run -a "${module}" || failed=1
            echo "::endgroup::"
          done
          exit "${failed}"

      # The gate is total, and it is met on a machine holding neither the
      # cartridge nor the microcode, which is what this runner is. Anything that
      # needs either is a script rather than a test, or lives in a file kept out
      # of the measurement and reports as skipped.
      - name: Coverage must be total
        run: python3 -m coverage report

  release:
    name: release
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install release tooling
        run: pnpm install --frozen-lockfile

      # npm's signature verification has no equivalent here, so what is checked
      # is the advisory database rather than the provenance of each tarball.
      - name: Check the release tooling against known advisories
        run: pnpm audit --audit-level=high

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
