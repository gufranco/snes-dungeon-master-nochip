[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "build",
  "mos65xx-python",
  "snes-dsp-python",
  "snes-mapper-python",
  "snes-rom-image-python",
  "validated",
  "validated-v2",
  "validated-v3",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
  "PL",
  "BLE",
  "C4",
]
ignore = [
  "PLR0913",
  "PLR2004",
  "PLR0912",
  "PLR0915",
  "PLR0911",
  "PLC0415",
  "PLR0917",
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"*.test.py" = ["PLR2004"]
"doctor.py" = ["BLE001"]
"environment.py" = ["BLE001", "T201"]
"tools/verify_multiply.py" = ["BLE001"]
"tools/verify_merge.py" = ["BLE001"]
"tools/verify_commands.py" = ["BLE001"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
  "*.retail.test.py",
  "mos65xx-python/*",
  "snes-dsp-python/*",
  "snes-mapper-python/*",
  "snes-rom-image-python/*",
  "snes-graphics-python/*",
  "snes-driver-python/*",
  "build/*",
  "emu/*",
  "snes9x/*",
  "validated/*",
  "validated-v2/*",
  "validated-v3/*",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
  'if __name__ == "__main__":',
]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true
warn_no_return = true
strict_equality = true
extra_checks = true
enable_error_code = [
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]
files = ["."]
exclude = "^(?!tools/|[^/]+\\.py$)"

[[tool.mypy.overrides]]
module = ["snesdsp.*", "snesdsp", "mos65xx.*", "mos65xx", "mapper.*", "mapper", "romimage.*", "romimage"]
ignore_missing_imports = true
